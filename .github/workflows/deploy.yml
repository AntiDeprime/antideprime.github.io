name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install image tooling
        run: sudo apt-get update && sudo apt-get install -y webp ffmpeg

      - name: Generate optimized assets
        run: ./scripts/build_assets.sh

      - name: Build CSS
        run: npm run build:css

      - name: Generate HTML
        run: uv run python generate.py

      - name: Ensure generated output is committed
        run: git diff --exit-code -- index.html robots.txt sitemap.xml llms.txt site.webmanifest styles.css

      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p site
          cp index.html styles.css theme.js analytics.js robots.txt sitemap.xml llms.txt site.webmanifest site/
          cp -R assets site/assets

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
